<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDIIA Security – Cetak Kartu</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  .lembar { display: flex; flex-wrap: wrap; gap: 6mm; justify-content: flex-start; }
  .kartu-cetak { width: 85.6mm; height: 54mm; border: 1px dashed #999; border-radius: 3mm; background: #fff;
    display: flex; padding: 3mm; gap: 3mm; page-break-inside: avoid; break-inside: avoid; overflow: hidden; }
  .kartu-cetak .qr { width: 44mm; height: 44mm; flex: none; align-self: center; }
  .kartu-cetak .qr svg { width: 100%; height: 100%; }
  .kartu-cetak .teks { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .kartu-cetak .pondok { font-size: 7.5pt; color: #1f7a3f; font-weight: 700; text-transform: uppercase; }
  .kartu-cetak .judul { font-size: 13pt; font-weight: 900; line-height: 1.1; margin: 1.5mm 0; }
  .kartu-cetak .milik { font-size: 7.5pt; color: #555; }
  .kartu-cetak .nama { font-size: 10pt; font-weight: 700; }
  .kartu-cetak .nomor { font-size: 9pt; margin-top: 1.5mm; background: #1f7a3f; color: #fff;
    padding: 0.8mm 2mm; border-radius: 2mm; align-self: flex-start; }
  .kartu-cetak .catatan { font-size: 6pt; color: #777; margin-top: 2mm; }
  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .wrap { padding: 0; max-width: none; }
    @page { size: A4; margin: 10mm; }
  }
</style>
</head>
<body>
<div id="login"></div>
<div id="app" hidden class="wrap">
  <div class="no-print top">
    <h2>Cetak Kartu Izin</h2>
    <button class="btn" onclick="print()">🖨 Cetak</button>
  </div>
  <p class="no-print">Cetak di kertas tebal / art paper, gunting, lalu laminating. Ukuran kartu = ukuran KTP.</p>
  <div class="lembar" id="lembar"></div>
</div>

<script type="module">
import { db, pasangLogin, esc } from "./js/common.js";
import { NAMA_PONDOK } from "./js/firebase-config.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

function qrSvg(teks) {
  const q = qrcode(0, "M"); q.addData(teks); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}

pasangLogin({
  peranDiizinkan: ["admin"],
  judul: "MDIIA Security – Cetak Kartu",
  onMasuk: async () => {
    const snap = await getDocs(collection(db, "kartu"));
    const kartu = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.pemilik + a.nomor).localeCompare(b.pemilik + b.nomor));
    document.getElementById("lembar").innerHTML = kartu.map((k) => `
      <div class="kartu-cetak">
        <div class="qr">${qrSvg("IZIN:" + k.id)}</div>
        <div class="teks">
          <div class="pondok">${esc(NAMA_PONDOK)}</div>
          <div class="judul">KARTU IZIN KELUAR</div>
          <div class="milik">Milik pengasuh:</div>
          <div class="nama">${esc(k.pemilik)}</div>
          <div class="nomor">${esc(k.nomor)}</div>
          <div class="catatan">Tunjukkan ke satpam saat keluar. Kembalikan ke pengasuh.</div>
        </div>
      </div>`).join("") || "<p>Belum ada kartu. Buat dulu di halaman Admin.</p>";
  },
});
</script>
</body>
</html>
